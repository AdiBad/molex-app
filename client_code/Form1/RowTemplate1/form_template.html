<anvil-form container="DataRowPanel" prop:visible="true" prop:role="molex-recommendation-card">
  <anvil-component type="FlowPanel" name="flow_panel_1" prop:role="molex-recommendation-heading">
    <anvil-component type="Label" name="label_5" prop:text="SIMILAR FRAGRANCE" prop:role="molex-eyebrow"></anvil-component>
    <anvil-component type="Label" name="label_6" prop:role="molex-recommendation-name"></anvil-component>
    <anvil-component type="Label" name="label_7" prop:text="Model" prop:visible="false"></anvil-component>
    <anvil-component type="Label" name="label_8" prop:visible="false"></anvil-component>
  </anvil-component>

  <anvil-component type="FlowPanel" name="score_panel" prop:role="molex-recommendation-score">
    <anvil-component type="Label" name="label_9" prop:text="Similarity" prop:role="molex-score-label"></anvil-component>
    <anvil-component type="Label" name="label_10" prop:role="molex-score-value"></anvil-component>
  </anvil-component>

  <anvil-component type="FlowPanel" name="flow_panel_2" prop:role="molex-recommendation-description">
    <anvil-component type="Label" name="label_11" prop:text="Fragrance profile" prop:role="molex-detail-label"></anvil-component>
    <anvil-component type="TextBox" name="text_box_1" prop:role="molex-recommendation-copy"></anvil-component>
  </anvil-component>

  <anvil-component type="Spacer" name="spacer_1" prop:height="8"></anvil-component>
</anvil-form>
